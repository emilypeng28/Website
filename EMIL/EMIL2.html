function colorWheel()
{
	let step=5;
	if(r>=255 && g<=255 && b<=0)
		{
			//console.log("A");
			g=g+step;
			//console.log(g);
		}
	else if(r>=0 && g>=255 & b<=0)
		{
			r=r-step;
		}
	else if(g>=255 && b<=255 && r<=0)
		{
			b=b+step;
		}
	else if(g>=0 && b>=255 & r<=0)
		{
			g=g-step;
		}
	else if(b>=255 && r<=255 && g<=0)
		{
			r=r+step;
		}
	else if(b>=0 && r>=255 & g<=0)
		{
			b=b-step;
		}
	
}

function rainbowBackground(start)
{
	//rect(0, 100, 800, 200);
	
	let r=255;
	let g=0;
	let b=0;
	let step=1530/200;
	for(i=100; i<300; i=i+1)
		{
			stroke(r, g, b);
			line(start, i, start+200, i);
				if(r>=255 && g<=255 && b<=0)
		{
			//console.log("A");
			g=g+step;
			//console.log(g);
		}
	else if(r>=0 && g>=255 & b<=0)
		{
			r=r-step;
		}
	else if(g>=255 && b<=255 && r<=0)
		{
			b=b+step;
		}
	else if(g>=0 && b>=255 & r<=0)
		{
			g=g-step;
		}
	else if(b>=255 && r<=255 && g<=0)
		{
			r=r+step;
		}
	else if(b>=0 && r>=255 & g<=0)
		{
			b=b-step;
		}
		}
}

function initial()
{
	r=255;
	g=0;
	b=0;
}

function boxReference(step)
{
	noFill();
	for(i=0; i<800; i=i+step)
		{
			square(i, (400/2)-(step/2), step);
			
		}
}


/**
* draws a grid as guide/reference
*
*@param {num} - gridSize - the density of the grid
*@param {num} - interval - how often a line in the grid should be bolded
*
*/
function guides(gridSize, interval)
{
	noFill();
	//vertical lines
	for(q=0; q<800; q=q+gridSize)
		{
			//drawing lines
			stroke(0);
			
			//makes a thicker line every 5 lines
			if(floor(q/(interval*gridSize))==q/(interval*gridSize))
			{
				strokeWeight(3)
			}
			else
			{
				strokeWeight(1)
			}
			
			//draws line
			line(q, 0, q, 400);
		}
	
	//horzontal lines
	for(q=0; q<400; q=q+gridSize)
		{
			//makes line thicker every 5 lines
			if(floor(q/(interval*gridSize))==q/(interval*gridSize))
			{
				strokeWeight(3)
			}
			else
			{
				strokeWeight(1)
			}
	
			//draws line
			line(0, q, 800, q);
		}
	
}
