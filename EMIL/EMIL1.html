<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>


    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

    <style>

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        justify-content: center;
        align-items: center;
      } 
    </style>

  </head>
    
  <body>
    <button onClick="window.location.reload();" style="height: 20px;">Refresh</button>

    <div>
      <script>
        
let myWidth=800;
let myHeight=400;

let MouseX = 0;
let MouseY = 0;

//setup function----------
function setup() {
	
if (windowWidth/800 < (windowHeight-30)/400){
    myWidth=windowWidth;
    myHeight=400*windowWidth/800;
}
else {
    myWidth=800*(windowHeight-30)/400;
    myHeight=windowHeight-30;
}
    
createCanvas(myWidth, myHeight);


	frameRate(20);
}



function windowResized() {


if (windowWidth/800 < (windowHeight-30)/400){
    myWidth=windowWidth;
    myHeight=400*windowWidth/800;
}
else {
    myWidth=800*(windowHeight-30)/400;
    myHeight=windowHeight-30;
}
    
  resizeCanvas(myWidth, myHeight);

  
}

let r=255;
let g=0;
let b=0;

function draw() {

    
scale(myWidth/800);
MouseX=800*mouseX/myWidth;
MouseY=800*mouseY/myWidth;



	fill(200);
	
	drawE(0, 0.5);
	drawM(0, 0.5);
	drawI(0, 0.5);
	drawL(0, 0.5);
	colorWheel();
	
	tDraw(0, 1);
	
	noFill();
	square(200, 0, 400);
	guides(50, 4)
	//boxReference(200);
}





function tDraw(index, size)
{
	let x=400;
	let y=200;
	if(index==0)
		{
		//console.log("a");
			
			stroke(0);
			
			
			//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			rect(x-100*size, y-30*size, 150*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 250*size);
			
			
			noStroke();
			fill(r, g, b);
			
			
			//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			rect(x-100*size, y-30*size, 150*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 250*size);
			
		
		}
}


function drawE(index, size)
{
	let x=100;
	let y=200;
	if(index==0)
		{
			//console.log("a");
			
			stroke(0);
			
			
			//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			rect(x-100*size, y-30*size, 150*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 250*size);
			
			
			noStroke();
			fill(r, g, b);
			
			
			//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			rect(x-100*size, y-30*size, 150*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 250*size);
			
		}
}

function drawM(index, size)
{
	let x=300;
	let y=200;
	if(index==0)
		{
			//console.log("a");
			
			stroke(0);
		
			//horizontal lines
			rect(x-30*size, y, 60*size, 50*size);
			
			//vertical lines
			rect(x-150*size, y-150*size, 50*size, 300*size);
			rect(x+100*size, y-150*size, 50*size, 300*size);
			
			//other straight lines
			quad(x-100*size, y-150*size, x-130*size, y-100*size, x-30*size, y+50*size, x, y);
			quad(x+100*size, y-150*size, x+130*size, y-100*size, x+30*size, y+50*size, x, y);
			
			noStroke();
			fill(r, g, b);
			
			
			//horizontal lines
		rect(x-30*size, y, 60*size, 50*size);
			
			//vertical lines
			rect(x-150*size, y-150*size, 50*size, 300*size);
			rect(x+100*size, y-150*size, 50*size, 300*size);
			
			//other straight lines
			quad(x-100*size, y-150*size, x-130*size, y-100*size, x-30*size, y+50*size, x, y);
			quad(x+100*size, y-150*size, x+130*size, y-100*size, x+30*size, y+50*size, x, y);
			
			
		}
}


function drawI(index, size)
{
	let x=500;
	let y=200;
	if(index==0)
		{
			//console.log("a");
			
			stroke(0);
		
			//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			
			//vertical lines
			rect(x-25*size, y-150*size, 50*size, 300*size);
		
			noStroke();
			fill(r, g, b);
			
			
				//horizontal lines
			rect(x-100*size, y-150*size, 200*size, 50*size);
			rect(x-100*size, y+100*size, 200*size, 50*size);
			
			//vertical lines
			rect(x-25*size, y-150*size, 50*size, 300*size);
		
		}
}


function drawL(index, size)
{
	let x=700;
	let y=200;
	if(index==0)
		{
			//console.log("a");
			
			stroke(0);
		
			//horizontal lines
			rect(x-100*size, y+100*size, 200*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 300*size);
		
			
			noStroke();
			fill(r, g, b);
			
			//console.log(r, g, b);
			//horizontal lines
			rect(x-100*size, y+100*size, 200*size, 50*size);
			
			//vertical lines
			rect(x-100*size, y-150*size, 50*size, 300*size);
		
		}
}

function colorWheel()
{
	let step=5;
	if(r>=255 && g<=255 && b<=0)
		{
			//console.log("A");
			g=g+step;
			//console.log(g);
		}
	else if(r>=0 && g>=255 & b<=0)
		{
			r=r-step;
		}
	else if(g>=255 && b<=255 && r<=0)
		{
			b=b+step;
		}
	else if(g>=0 && b>=255 & r<=0)
		{
			g=g-step;
		}
	else if(b>=255 && r<=255 && g<=0)
		{
			r=r+step;
		}
	else if(b>=0 && r>=255 & g<=0)
		{
			b=b-step;
		}
	
}

function initial()
{
	r=255;
	g=0;
	b=0;
}

function boxReference(step)
{
	noFill();
	for(i=0; i<width; i=i+step)
		{
			square(i, (height/2)-(step/2), step);
			
		}
}


/**
* draws a grid as guide/reference
*
*@param {num} - gridSize - the density of the grid
*@param {num} - interval - how often a line in the grid should be bolded
*
*/
function guides(gridSize, interval)
{
	noFill();
	//vertical lines
	for(q=0; q<800; q=q+gridSize)
		{
			//drawing lines
			stroke(0);
			
			//makes a thicker line every 5 lines
			if(floor(q/(interval*gridSize))==q/(interval*gridSize))
			{
				strokeWeight(3)
			}
			else
			{
				strokeWeight(1)
			}
			
			//draws line
			line(q, 0, q, 400);
		}
	
	//horzontal lines
	for(q=0; q<400; q=q+gridSize)
		{
			//makes line thicker every 5 lines
			if(floor(q/(interval*gridSize))==q/(interval*gridSize))
			{
				strokeWeight(3)
			}
			else
			{
				strokeWeight(1)
			}
	
			//draws line
			line(0, q, 800, q);
		}
	
}

      </script>
  </div>
    
  </body>
</html>
