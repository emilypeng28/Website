<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>


    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

    <style>

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        justify-content: center;
        align-items: center;
      } 
    </style>

  </head>
    
  <body>
    <button onClick="window.location.reload();" style="height: 20px;">Refresh</button>

    <div>
      <script>
                

        let myWidth=640;
        let myHeight=390;

              
        let MouseX = 0;
        let MouseY = 0;


        function setup() {
            
        if (windowWidth/640 < (windowHeight-30)/360){
            myWidth=windowWidth;
            myHeight=360*windowWidth/640;
        }
        else {
            myWidth=640*(windowHeight-30)/360;
            myHeight=windowHeight-30;
        }
          createCanvas(myWidth, myHeight);
        }



        function windowResized() {
            
        if (windowWidth/640 < (windowHeight-30)/360){
            myWidth=windowWidth;
            myHeight=360*windowWidth/640;
        }
        else {
            myWidth=640*(windowHeight-30)/360;
            myHeight=windowHeight-30;
        }
            resizeCanvas(myWidth, myHeight);
        }
        //Auto variables

        //let fontOswald;

        //colours: water red, water green, water blue
        let wr=100;
        let wg=100; 
        let wb=250;

        const ar = [0, 0];


        //Input variables

        //fish: x-coordinate, y-coordinate, mode
        let fx=80;
        let fy=260;
        let md=1;

        //colours: darkness(%)
        let dk=1;




        function draw() {
            
            scale(myWidth/640);
            MouseX=640*mouseX/myWidth;
            MouseY=640*mouseY/myWidth;

            roomBackground(dk);
            
            dTank(dk);
            dFish(fx, fy, md, dk);
            fx=ar[0];
            fy=ar[1];

            
            guides(20);
        }



        /*
        function preload() {
          fontOswald = loadFont('Oswald-Regular.ttf')
        }
        */
        function roomBackground(d)
        {
          background(230*d, 250*d, 230*d);
          
          //shelf
          fill(200*d, 150*d, 100*d);
          rect(-20, 100, 260, 20)
          
          //table
            rect(-20, 320, 360, 60)
          
          //door
          rect(400, 40, 220, 400);
          
          //fish food
          fill(255*d, 100*d, 100*d);
          rect(60, 30, 50, 70);
          
          fill(255*d, 255*d, 255*d);
          rect(60, 30, 50, 10);
          rect(60, 60, 50, 20);
          
          fill(0);
          //textFont(fontOswald);
          text("Fish Food", 65, 75);
          
          
        }

        function dFish(x, y, m, d)
        {
          if (m==1)
            {
              let my = (MouseY-y)/100;
              let mx = (MouseX-x)/100;
              
            
          //		print(y);
              
              y=y+my;
              x=x+mx;
              
              if(x<60)
                {
                  x=60;
                }
              else if(x>280)
                {
                  x=280;
                }		
              if(y<180)
                {
                  y=180;
                }
              else if(y>290)
                {
                  y=290;
                }
              
              fishTail(x, y, mx, my, d);
            
              //fish body
              fill(250*d, 200*d, 100*d);
              ellipse(x, y, 25, 20);
              
              fishEyes(x, y, mx, my);
              
              ar[0] = x;
              ar[1] = y;
              return ar;
            }
          
        }

        function fishEyes(x, y, mx, my)
        {
          let exl=-10;
          let ey=y+my*4;
          let exr=-10;
          
          
          if (mx<0) //if on left side
            {			
              if((x+mx*5-5) > x-15)
                {
                //	circle(x+mx*4-5, y+my*4, 5);
                  exl=x+mx*4-5;
                //	eyl=y+my*4;
                //	print("r");
                }
              
              if((x+mx*5+5)<x-8)
                {
                //	circle(x-8, y+my*5, 5);
                  exr=x-8;
                //	eyr=y+my*5;
                }
              else
                {
                //	circle(x+mx*5+5, y+my*5, 5);
                  exr=x+mx*5+5;
                //	eyr=y+my*5;
                }		
              
              
            }
          else //if on right side
            {
              if((x+mx*5+5) < x+15)
                {
                  //circle(x+mx*4+5, y+my*4, 5);
                  exr=x+mx*4+5;
                }
              if((x+mx*5-5)>x+8)
                {
                //	circle(x+8, y+my*5, 5);
                  exl=x+8;
                }
              else
                {
                  //circle(x+mx*5-5, y+my*5, 5);
                  exl=x+mx*5-5;
                }			
            }
          
          if (my<0)
            {
              if(y+my*4<y-8)
                {
                  ey=y-8;
                }
            }
          else 
            {
              if(y+my*4>y+8)
                {
                  ey=y+8;
                }
            }
          
          fill(0);
          circle(exl, ey, 3);
          circle(exr, ey, 3);
          
          
          
        }

        function fishTail(x, y, mx, my, d)
        {
          //variables: center x, center y, tail edge x, upper y, lower y
          let cx=x;
          let cy=y;
          let tx=x;
          let uy=x-13;
          let dy=y+13;
          
          //
          if(my<-2)
            {
              my=-2;
            }
          else if(my>2)
            {
              my=2;
            }
        //	print(my);
          
          //modifying tail x
          cx=x-mx*4;
          tx=x-mx*10;
          if(cx<x-12)
            {
              cx=x-12;
            }
          else if(cx>x+12)
            {
              cx=x+12;
            }
          if(tx<x-25)
            {
              tx=x-25;
            }
          else if(tx>x+25)
            {
              tx=x+25;
            }
          
          //modifying tail y
          cy=y-my*3;
          uy=cy-my*2-10;
          dy=cy-my*2+10;
          
          if(cy<y-5)
            {
              cy=y-5;
            }
          else if(cy>y+5)
            {
              cy=y+5;
            }
          
          
          fill(250*d, 200*d, 100*d);
          triangle(cx, cy, tx, uy, tx, dy);
        }

        function dTank(d)
        {
          //variables: length, height, x-coordinate, y-coordinate
          let tl = 260;
          let th = 160;
          let x = 40;
          let y = 160
          
          let rr = random(-10, 10)/5;
          let rg = random(-10, 10)/5;
          let rb = random(-10, 10)/5;
          
          wr=wr+rr;
          wg=wg+rg;
          wb=wb+rb;
          
          if(wr<120 && wg<160 && wg<255)
            {
              if(wr<90)
                {
                  wr=95;
                }
              if(wg<100)
                {
                  wg=105;
                }
              if(wb<200)
              {
                wb=205;
              }
            }
          else if(wr>120)
            {
              wr=115;
            }
          else if(wg>160)
            {
              wg=155;
            }
          else if(wb>255)
            {
              wb=250;
            }
          
          //tank
          fill(200*d, 200*d, 250*d);
          rect(x, y, tl, th);
          
          //water
          fill(wr*d, wg*d, wb*d);
          rect(x, y+20, tl, th-20);
          
          //sand
          fill(250*d, 200*d, 100*d);
          rect(x, y+th, tl, -30);
        }


        function guides(s)
        {
          for(q=0; q<width*640; q=q+s)
            {
              if(floor(q/100)==q/100)
                {
                  strokeWeight(3)
                  //print("2");
                }
              else
                {
                  strokeWeight(1)
                  //print("1");
                }
              
              line(q, 0, q, height*640);
            }
          
          for(q=0; q<height*640; q=q+s)
            {
              
                if(floor(q/100)==q/100)
                {
                  strokeWeight(3)
                  //print("2");
                }
              else
                {
                  strokeWeight(1)
                  //print("1");
                }
              
              line(0, q, width*640, q);
            }
          
        }

      </script>
  </div>
    
  </body>
</html>
