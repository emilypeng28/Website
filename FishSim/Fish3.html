<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>


    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        justify-content: center;
        align-items: center;
      } 
    </style>

  </head>
    
  <body>
    <script>
        let myWidth=640;
        let myHeight=390;

              
        let MouseX = 0;
        let MouseY = 0;


        function setup() {
            
        if (windowWidth/640 < (windowHeight-30)/360){
            myWidth=windowWidth;
            myHeight=360*windowWidth/640;
        }
        else {
            myWidth=640*(windowHeight-30)/360;
            myHeight=windowHeight-30;
        }
          createCanvas(myWidth, myHeight);
          reset();
        }



        function windowResized() {
            
        if (windowWidth/640 < (windowHeight-30)/360){
            myWidth=windowWidth;
            myHeight=360*windowWidth/640;
        }
        else {
            myWidth=640*(windowHeight-30)/360;
            myHeight=windowHeight-30;
        }
            resizeCanvas(myWidth, myHeight);
        }


      //Input variables

      //fish: x-coordinate, y-coordinate, mode
      let fishX=80;
      let fishY=260;
      let mode=1;

      //food: mode, x-coordinate, y-coordinate, drop acceleration
      let food=0;
      let foodX=-10;
      let foodY=-10;
      let acceleration = 1;

      //bubble trick: mode, bubble size, x-coordinate, y-coordinate
      let trickMode=0;
      let size=1;
      let bubbleX=-10;
      let bubbleY=-10;

      //colours: darkness(%), light switch
      let darkness=1;
      let indoorLight=1;



      //Auto variables

      //let fontOswald;

      //colours: water red, water green, water blue
      let waterRed=100;
      let waterGreen=100; 
      let waterBlue=250;


      //arrays: returning positionX and positionY for fish, positionX for fish food, positionY for fish food
      const seaweedCount = [0, 0, 1, 0];
      const foodShapeX=[0, 0, 0, 0, 0, 0, 0, 0];	
      const foodShapeY=[0, 0, 0, 0, 0, 0, 0, 0];

      //Collection array: seaweed, bubbles
      const seaweed= [0];
      const bubbles= [0];
        
        
      //mouse down
      let mouseDown=0;


      function draw() {
        
        
        scale(myWidth/640);
        MouseX=640*mouseX/myWidth;
        MouseY=640*mouseY/myWidth;


        darkness=indoorLight;
        roomBackground(darkness);
        lightSwitch(indoorLight);
        indoorLight=seaweedCount[2];
        mouseDown=seaweedCount[3];
        //print(darkness);
        
        drawTank(darkness);
        //changeSeaweed(seaweed);
        
        //print(seaweed.length);
        
        for(q=0; q<seaweed.length/2; q++)
          {
            drawSeaweed(seaweed, q+1);
          }
        
        drawBubbles(10, 15);
        
        drawFish(fishX, fishY, mode, darkness);
        fishX=seaweedCount[0];
        fishY=seaweedCount[1];

        drawBubbles(10, 10);
        drawSeaweed(seaweed, 2);
        drawSeaweed(seaweed, 5);
        
        drawFood(food);
        

        
        

        
        //guides(20);
      }


      /*
      //loading Oswald font
      function preload() {
        fontOswald = loadFont('Oswald-Regular.ttf')
      }
      */
      //for key inputs
      function keyPressed()
      {
        if (keyCode === ENTER) 
        {
      //		print("a");
          reset();
        }
        if (key == " ")
          {
            trickMode=1;
            
          }
      }

      //resets variables
      function reset()
      {
        
      //Auto variables

      //colours: water red, water green, water blue
      waterRed=100;
      waterGreen=100; 
      waterBlue=250;


      //Input variables

      //fish: x-coordinate, y-coordinate, mode
      fishX=80;
      fishY=260;
      mode=1;

      //food
      food=0;
      foodX=-10;
      foodY=-10;
      acceleration = 1;
        
      //colours: darkness(%)
      darkness=1;
        indoorLight=1;

        trickMode=0;
      size=1;
      bubbleX=-10;
      bubbleY=-10;
        
        //seaweed
        setSeaweed(60, 300, 5, 1);
        setSeaweed(70, 300, 2, 2);
        setSeaweed(75, 300, 4, 3);
        setSeaweed(240, 300, 2, 4);
        setSeaweed(270, 300, 4, 5);
        setSeaweed(280, 300, 3, 6);
        
        for(i=0; i<bubbles.length; i=i+1)
          {
              bubbles[i]= 0;
          }

        
      }

      //bubbles
      function drawBubbles(size, probablility)
      {
        let positionX=0;
        let positionY=0;
        let bubbleProbablility= floor(random(0, probablility*5));
        //print(bubbleProbablility);
        if(bubbleProbablility==0)
          {
            
            for(i=0; i<bubbles.length+1; i++)
              {
                
                if(bubbles[i]==0 || bubbles[i]==null)
                  {
                    const bubble=[ceil(random(50, 290)), ceil(random(260, 300)), random(size-5, size+5), random(200, 255), random(200, 255), random(200, 255), random(0.1, 0.5)];
                    bubbles[i]=bubble;
                    //print(bubbles);
                    i=bubbles.length+3;
                    
                  }
              }
          }
        
        
        
        
            for(i=0; i<bubbles.length; i++)
            {
              
              if(bubbles[i]!=0)
          {
              
              fill(bubbles[i][3], bubbles[i][4], bubbles[i][5], 50);
            circle(bubbles[i][0], bubbles[i][1], bubbles[i][2]);
              
            //	print(bubbles);
              bubbles[i][1]=bubbles[i][1]-bubbles[i][6];
              if(bubbles[i][1]<200)
                {
                  bubbles[i]=0;
                } 
            }
          
            }
        
      }

      function setSeaweed(positionX, positionY, size, number)
      {
        
        

        const seaweedX=[positionX];
        const seaweedY=[positionY];
        
        
        for(i=1; i<size+1; i=i+1)
          {
            if(i/2!=ceil(i/2))
              {
                seaweedX[i]=positionX-5;					
                seaweedY[i]=positionY-20*i;
                
              }
            else
              {
                seaweedX[i]=positionX;
                seaweedY[i]=positionY-20*i;
                
              //	print("bubbleProbablility");
              }
          }
        if(size/2==ceil(size/2))
          {
            for(i=size+1; i<size*2; i=i+1)
          {
            if(i/2!=ceil(i/2))
              {
                
                seaweedX[i]=positionX;					
                seaweedY[i]=positionY-20*((size*2)-i);
              }
            else
              {
                
                seaweedX[i]=positionX+5;					
                seaweedY[i]=positionY-20*((size*2)-i);
              //	print("bubbleProbablility");
              }
            
          }
          //print(seaweedX);
          }
        else
          {
            for(i=size+1; i<size*2; i=i+1)
          {
            if(i/2!=ceil(i/2))
              {
                
                seaweedX[i]=positionX;					
                seaweedY[i]=positionY-20*((size*2)-i);
              }
            else
              {
                
                seaweedX[i]=positionX+5;					
                seaweedY[i]=positionY-20*((size*2)-i);
              //	print("bubbleProbablility");
              }
            
          }
          //print(seaweedX);

          }
            
        
        
        
        
        
        
      //print(seaweedXa);
        //print(seaweedXb);
        
      seaweed[2*(number-1)]=seaweedX;
        seaweed[2*(number-1)+1]=seaweedY;
        
        return seaweed;
        

      }

      function changeSeaweed(seaweedCount, number)
      {
        for(i=0; i<seaweedCount.length; i=i+2)
          {
            for(w=1; w<seaweedCount[i].length; w=w+1)
              {
                seaweedCount[i][w]=seaweedCount[i][w]+random(-1, 1)/10;
                if(seaweedCount[i][w]<seaweedCount[i][0]-5)
                  {
                    seaweedCount[i][w]=seaweedCount[i][0]-5;
                  }
                else if(seaweedCount[i][w]>seaweedCount[i][0]+5)
                  {
                    seaweedCount[i][w]=seaweedCount[i][0]+5;
                  }
              }
          }
      }

      function drawSeaweed(seaweedCount, number)
      {
        changeSeaweed(seaweedCount, number);
        
        stroke(0);
        fill(100*darkness, 200*darkness, 100*darkness);
        beginShape();

        for(i=0; i<seaweedCount[number].length; i++)
          {
            vertex(seaweedCount[2*(number-1)][i], seaweedCount[2*(number-1)+1][i]);
          }
        
        endShape(CLOSE);


      }


      //makes food
      function drawFood(foodMode)
      {
        
        //check if fish food is clicked
        if(MouseX>70 && MouseX<100 && MouseY>30 && MouseY<100 && mouseIsPressed && food==0)
          {
            foodMode=1;
            mode=2;
            
          }
        
        //if fish food is not clicked
        if(foodMode==0)
          {
            foodX=-10;
            foodY=-10;
            
          }
        //making food
        else if(foodMode==1)
          {
            
            for(i=0; i<foodShapeX.length; i++)
              {
                foodShapeX[i]=random(-5, 5);
                foodShapeY[i]=random(-5, 5);
              }
          
            
            foodShape(foodX, foodY, foodShapeX, foodShapeY);
          }	
        //picking up food
          else if(foodMode==2)
            {
              stroke(0);
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
              noStroke();
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
              
              
            foodX=MouseX;
            foodY=MouseY;
            }
        //dropping food
        else if(foodMode==3)
          {
            
              //	let r = random(150, 200);
            
            
            stroke(0);
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
              noStroke();
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
            //print(acceleration);
            if (foodY<290)
              {
                foodY=foodY+acceleration;
                if(foodY<180)
                  {
                    acceleration=acceleration*1.1;
                  }
                else
                  { 
                  
                        acceleration=acceleration*0.85;
                      
                    
                  }
                if(foodY>285)
                  {
                    foodY=285;
                    acceleration=0;
                  }
                
              
              }
            
            
          }
        else if(foodMode==4)
          {
              stroke(0);
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
              noStroke();
              foodShape(foodX, foodY, foodShapeX, foodShapeY);
            //print(acceleration);
        
                foodY=foodY+acceleration;
                
                    acceleration=acceleration*1.1;
              
            
              
              
            
          }
        
        //changing food modes
          if(foodMode==1)
          {
            foodMode=2;
          }
        else if(foodMode==2 && mouseIsPressed==false)
          {
            if(foodX>60 && foodX<280 && foodY<290)
              {
                foodMode=3;
              }
            else
              {
                foodMode=4;
                
              }
          }
        else if(foodMode==3 && foodX>fishX-10 && foodX<fishX+10 && foodY>fishY-10 && foodY<fishY+10)
          {
            foodMode=0;
            mode=1;
            acceleration=1;
          }
        else if(foodMode==4 &&  foodY>height)
          {
            foodMode=0;
            mode=1;
            acceleration=1;
          
          }
        
        food=foodMode;
        return food;
        
      }

      //creates random food shape
      function foodShape(positionX, positionY, foodShapeX, foodShapeY)
      {
        
        fill(250*darkness, 200*darkness, 100*darkness);
        beginShape();

        for(i=0; i<foodShapeX.length+1; i++)
          {
            vertex(foodShapeX[i]+positionX, foodShapeY[i]+positionY);
          }
        
        endShape(CLOSE);
        
      }

      //draws fish
      function drawFish(positionX, positionY, fishMode, darkness)
      {
        if (fishMode==1)
          {
            slopeY = (MouseY-positionY)/100;
            slopeX = (MouseX-positionX)/100;
            
            if(slopeX>2.4)
              {
                slopeX=2.4;
              }
            else if(slopeX<-2.4)
              {
                slopeX=-2.4
              }
            
            if(slopeY>2)
              {
                slopeY=2;
              }
            else if (slopeY<-2)
              {
                slopeY=-2;
              }
            
          }
        if (fishMode==2)
          {
            slopeX=(foodX-positionX)/50;
            slopeY = (foodY-positionY)/50;
            
            
          }
        
        
        positionY=positionY+slopeY;
            positionX=positionX+slopeX;
            
            if(positionX<60)
              {
                positionX=60;
              }
            else if(positionX>280)
              {
                positionX=280;
              }		
            if(positionY<180)
              {
                positionY=180;
              }
            else if(positionY>290)
              {
                positionY=290;
              }
        
        

        
        
            stroke(0);
            fishTail(positionX, positionY, slopeX, slopeY, darkness);
          
            //fish body
            fill(250*darkness, 200*darkness, 100*darkness);
            ellipse(positionX, positionY, 25, 20);
            
            fishEyes(positionX, positionY, slopeX, slopeY);
            
        
          if(trickMode==1)
          {
        

        bubbleY=positionY+slopeY*4;
        bubbleX=positionX+slopeX*4+size*slopeX/4.5;
        
            
            //	if (size<40)
          //			{
                  size=size+0.1;
            //		}
            
          fill(waterRed+30, waterGreen+30, waterBlue+30, 100);
            circle(bubbleX, bubbleY, size);
          //	size=size+0.1;
            
            if(bubbleX-size/2<40 || bubbleX+size/2>300 || bubbleY-size/2<190 || bubbleY+size/2>290)
              {
                trickMode=0;
                size=1;
              }
          }
        
        
            seaweedCount[0] = positionX;
            seaweedCount[1] = positionY;
            return seaweedCount;
        
      }

      //draws fish eyes
      function fishEyes(positionX, positionY, slopeX, slopeY)
      {
        let leftEyeX=-10;
        let eyeY=positionY+slopeY*4;
        let rightEyeX=-10;
        
        
        if (slopeX<0) //if on left side
          {			
            if((positionX+slopeX*5-5) > positionX-15)
              {
                leftEyeX=positionX+slopeX*4-5;
              }
            
            if((positionX+slopeX*5+5)<positionX-8)
              {
                rightEyeX=positionX-8;
              }
            else
              {
                rightEyeX=positionX+slopeX*5+5;
              }		
            
            
          }
        else //if on right side
          {
            if((positionX+slopeX*5+5) < positionX+15)
              {
                //circle(positionX+slopeX*4+5, positionY+slopeY*4, 5);
                rightEyeX=positionX+slopeX*4+5;
              }
            if((positionX+slopeX*5-5)>positionX+8)
              {
              //	circle(positionX+8, positionY+slopeY*5, 5);
                leftEyeX=positionX+8;
              }
            else
              {
                //circle(positionX+slopeX*5-5, positionY+slopeY*5, 5);
                leftEyeX=positionX+slopeX*5-5;
              }			
          }
        
        if (slopeY<0)
          {
            if(positionY+slopeY*4<positionY-8)
              {
                eyeY=positionY-8;
              }
          }
        else 
          {
            if(positionY+slopeY*4>positionY+8)
              {
                eyeY=positionY+8;
              }
          }
        
        fill(0);
        circle(leftEyeX, eyeY, 3);
        circle(rightEyeX, eyeY, 3);
        
        
        
      }

      //draws fish tail
      function fishTail(positionX, positionY, slopeX, slopeY, darkness)
      {
        //variables: center positionX, center positionY, tail edge positionX, upper positionY, lower positionY
        let centerX=positionX;
        let centerY=positionY;
        let tailX=positionX;
        let tailTopY=positionX-13;
        let tailBottomY=positionY+13;
        
        //
        if(slopeY<-2)
          {
            slopeY=-2;
          }
        else if(slopeY>2)
          {
            slopeY=2;
          }
      //	print(slopeY);
        
        //modifishYing tail positionX
        centerX=positionX-slopeX*4;
        tailX=positionX-slopeX*10;
        if(centerX<positionX-12)
          {
            centerX=positionX-12;
          }
        else if(centerX>positionX+12)
          {
            centerX=positionX+12;
          }
        if(tailX<positionX-25)
          {
            tailX=positionX-25;
          }
        else if(tailX>positionX+25)
          {
            tailX=positionX+25;
          }
        
        //modifishYing tail positionY
        centerY=positionY-slopeY*3;
        tailTopY=centerY-slopeY*2-10;
        tailBottomY=centerY-slopeY*2+10;
        
        if(centerY<positionY-5)
          {
            centerY=positionY-5;
          }
        else if(centerY>positionY+5)
          {
            centerY=positionY+5;
          }
        
        
        fill(250*darkness, 200*darkness, 100*darkness);
        triangle(centerX, centerY, tailX, tailTopY, tailX, tailBottomY);
      }

      //draws fish tank
      function drawTank(darkness)
      {
        //variables: length, height, x-coordinate, y-coordinate
        let tankLength = 260;
        let tankHeight = 160;
        let positionX = 40;
        let positionY = 160
        
        let randomRed = random(-10, 10)/5;
        let randomGreen = random(-10, 10)/5;
        let randomBlue = random(-10, 10)/5;
        
        waterRed=waterRed+randomRed;
        waterGreen=waterGreen+randomGreen;
        waterBlue=waterBlue+randomBlue;
        
        if(waterRed<120 && waterGreen<160 && waterGreen<255)
          {
            if(waterRed<90)
              {
                waterRed=95;
              }
            if(waterGreen<100)
              {
                waterGreen=105;
              }
            if(waterBlue<200)
            {
              waterBlue=205;
            }
          }
        else if(waterRed>120)
          {
            waterRed=115;
          }
        else if(waterGreen>160)
          {
            waterGreen=155;
          }
        else if(waterBlue>255)
          {
            waterBlue=250;
          }
        
        stroke(0);
        
        //tank
        fill(200*darkness, 200*darkness, 250*darkness);
        rect(positionX, positionY, tankLength, tankHeight);
        
        //water
        
        fill(waterRed*(darkness*0.9), waterGreen*(darkness*0.9), waterBlue*(darkness*0.9));
        rect(positionX, positionY+20, tankLength, tankHeight-20);
        
        //sand
        fill(250*darkness, 200*darkness, 100*darkness);
        rect(positionX, positionY+tankHeight, tankLength, -30);
      }

      //draws light switch and turns it on and off
      function lightSwitch(darkness)
      {
        stroke(0);
        fill(255*darkness);
        rect(320, 200, 40, 60);
        rect(330, 210, 20, 40);
        if(MouseX>320 && MouseX<360 && MouseY>200 && MouseY<260 && mouseIsPressed)
          {
            //print(mouseDown);
            if(mouseDown==0)
              {
                if(darkness==1 )
                {
                  darkness=0.5;
                mouseDown=1;
                }
                else 
                {
                  darkness=1;
                  mouseDown=1;
                  
                }
              
              }
            
          
            
            
          }
          if(mouseIsPressed==false)
              {
                mouseDown=0;
                //print("a");
              }
        
        seaweedCount[2]=darkness;
            seaweedCount[3]=mouseDown;
            return seaweedCount;
      }

      //draws room background
      function roomBackground(darkness)
      {
        background(230*darkness, 250*darkness, 230*darkness);
        stroke(0);
        
        //shelf
        fill(200*darkness, 150*darkness, 100*darkness);
        rect(-20, 100, 260, 20)
        
        //table
          rect(-20, 320, 360, 60)
        
        //door
        rect(400, 40, 220, 400);
        
        //fish food
        fill(255*darkness, 100*darkness, 100*darkness);
        rect(60, 30, 50, 70);
        
        fill(255*darkness, 255*darkness, 255*darkness);
        rect(60, 30, 50, 10);
        rect(60, 60, 50, 20);
        
        noStroke();
        fill(0);
      // textFont(fontOswald);
        text("Fish Food", 65, 75);
        
        
      }

      //draws grid as guide/reference
      function guides(s)
      {
        
        for(q=0; q<width; q=q+s)
          {
            stroke(0);
            if(floor(q/100)==q/100)
              {
                strokeWeight(3)
                //print("2");
              }
            else
              {
                strokeWeight(1)
                //print("1");
              }
            
            line(q, 0, q, height);
          }
        
        for(q=0; q<height; q=q+s)
          {
            
              if(floor(q/100)==q/100)
              {
                strokeWeight(3)
                //print("2");
              }
            else
              {
                strokeWeight(1)
                //print("1");
              }
            
            line(0, q, width, q);
          }
        
      }

    </script>
    <button onClick="window.location.reload();">Refresh</button>
  </body>
